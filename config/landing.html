<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Kolom Pencarian</title>
    
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "surface-card": "#FFFFFF",
                        "outline-variant": "#c3c6cf",
                        "outline": "#73777f",
                        "on-surface": "#0c1d2c",
                        "on-surface-variant": "#43474e",
                        "tertiary": "#001c2d",
                        "primary": "#001b36",
                        "on-primary": "#ffffff",
                        "brand-gradient-mid": "#0A3055"
                    },
                    fontFamily: {
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-lg": ["Plus Jakarta Sans"]
                    },
                    fontSize: {
                        "body-lg": ["16px", { "lineHeight": "1.75", "fontWeight": "400" }],
                        "label-lg": ["14px", { "lineHeight": "1", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>

    <style>
        input:focus {
            outline: none;
        }
    </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl bg-surface-card rounded-full p-2 flex items-center shadow-[0_12px_32px_rgba(13,48,85,0.15)] focus-within:ring-2 focus-within:ring-tertiary transition-all duration-250">
        
        <div class="flex-grow flex items-center pl-4 border-r border-outline-variant pr-4">
            <span class="material-symbols-outlined text-outline mr-2">search</span>
            <input class="w-full border-none focus:ring-0 text-body-lg font-body-lg text-on-surface placeholder:text-outline bg-transparent" placeholder="Cari kompetisi..." type="text"/>
        </div>
        
        <div class="px-4 hidden sm:flex items-center cursor-pointer hover:opacity-80 transition-opacity">
            <span class="text-label-lg font-label-lg text-on-surface-variant mr-2">Kategori</span>
            <span class="material-symbols-outlined text-outline">expand_more</span>
        </div>
        
        <button class="bg-primary text-on-primary rounded-full px-6 py-3 text-label-lg font-label-lg hover:bg-brand-gradient-mid transition-all duration-250 hover:-translate-y-0.5 ml-2">
            Cari
        </button>

    </div>
    </body>
</html>
