<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <section>
    <div class="Login-box">
        <form action="">
            <img src="Assets/rmbg_logo.png" class="logo">
            <h2>Login</h2>
            <div class="input-box">
                <span class="icon"><ion-icon name="mail"></ion-icon></span>
                <label>Email</label>
                <input type="email" id="emailInput" placeholder="Enter Email..." required>
            </div>
            <div class="input-box">
                <span class="icon"><ion-icon name="eye"></ion-icon></span>
                <label>Password</label>
                <input type="password" id="passInput" placeholder="Enter Password..." required>
            </div>
            <button type="button" onclick="showResult()">Login</button>
            <div class="register-link">
                <p>Didn't Have Account? <a href="#">Register</a></p>
            </div>  
            
        </form>
    </div>
    </section>

    <script src="login.js"></script>
    <script src="https://unpkg.com/ionicons@4.5.10-0/dist/ionicons.js"></script>
    <div class="popup" id="popup">
    <div class="popup-box">
        <p id="popupMessage"></p>
        <button onclick="closePopup()">OK</button>
    </div>
</div>
</body>
</html>
