<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competition Info</title>
<link rel="stylesheet" href="landing.css">
<script src="landing.js"></script>


</head>
<body>

<header class="hero">
<div class="navbar">
<div class="logo"><img src="Assets/logo.jpeg" alt="logo"> Info</div>
<div class="auth-buttons">
<button class="login">Login</button>
<button class="signup">Sign Up</button>
</div>
</div>

<div class="hero-content">
<h1>Find competitions <br>that match your skills</h1>

<div class="search-wrapper">
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search..." onkeyup="renderCards()">
</div>

<select id="categoryFilter" onchange="renderCards()">
<option value="All">Kategori</option>
<option value="Design">Design</option>
<option value="Programming">Programming</option>
<option value="Hacking">Hacking</option>
</select>
</div>
</div>
</header>

<section class="section">
<div class="card-grid" id="cardGrid"></div>
</section>

<!-- MODAL -->
<div class="modal" id="detailModal">
<div class="modal-content">
<div class="close-btn" onclick="closeDetail()">X</div>

<div class="modal-top">
<img id="modalImage">
<div class="modal-info">
<h2 id="modalTitle"></h2>
<p id="modalLocation"></p>
<p id="modalDate"></p>
<button class="register-btn">Register Now</button>
</div>
</div>

<div class="modal-description" id="modalDescription"></div>

<div class="organizer">
<img src="Assets/logo.jpeg">
<div>
<h4>Diselenggarakan oleh EduNation</h4>
<p>Organisasi pendidikan nasional yang fokus pada pengembangan siswa Indonesia.</p>
</div>
</div>

</div>
</div>

<section class="bottom-cta">
<h2>Unlock Your Potential</h2>
<p>Temukan berbagai kompetisi terbaik untuk meningkatkan skill dan membangun portofolio.</p>
</section>


</body>
</html>
